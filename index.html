rance); words inside a group sorted alphabetically.","String Matching Rabin-Karp":"<b>Input</b><br>Line 1: text<br>Line 2: pattern<br><b>Output</b><br>All starting indices where pattern occurs, space separated, or <code>-1</code>.","First Occurrence in Sorted Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: sorted array<br>Line 3: <code>x</code><br><b>Output</b><br>The first index of x, or <code>-1</code> (use binary search).","Tree Traversal (Inorder)":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: tree in level order, <code>-1</code> = no node<br><b>Output</b><br>The inorder traversal, space separated.","Tree Height":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: tree in level order, <code>-1</code> = no node<br><b>Output</b><br>The height as a number of nodes (empty tree = 0).","BST Search":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: values inserted into a BST in this order<br>Line 3: <code>x</code><br><b>Output</b><br><code>Found</code> or <code>Not Found</code>.","BFS Graph Traversal":"<b>Input</b><br>Line 1: <code>n m</code> (vertices 0..n-1, edges)<br>Next <code>m</code> lines: <code>u v</code> (undirected)<br><b>Output</b><br>BFS order from vertex 0, visiting neighbours in ascending order.","DFS Graph Traversal":"<b>Input</b><br>Line 1: <code>n m</code> (vertices 0..n-1, edges)<br>Next <code>m</code> lines: <code>u v</code> (undirected)<br><b>Output</b><br>DFS order from vertex 0, visiting neighbours in ascending order.","Connected Components":"<b>Input</b><br>Line 1: <code>n m</code> (vertices 0..n-1, edges)<br>Next <code>m</code> lines: <code>u v</code> (undirected)<br><b>Output</b><br>The number of connected components.","0/1 Knapsack":"<b>Input</b><br>Line 1: <code>n W</code><br>Line 2: weights<br>Line 3: values<br><b>Output</b><br>The maximum total value within capacity W.","Longest Common Subsequence":"<b>Input</b><br>Two lines, strings A and B.<br><b>Output</b><br>The length of their longest common subsequence.","Min Heap Opera nding (implement bubble sort).","String Builder Concatenation":"<b>Input</b><br>One line of space-separated words.<br><b>Output</b><br>All words concatenated with no spaces, using <code>StringBuilder</code>.","Reverse a String":"<b>Input</b><br>A string.<br><b>Output</b><br>The string reversed.","Stack Push Pop Sequence":"<b>Input</b><br>Line 1: <code>q</code><br>Next q lines: <code>push x</code> or <code>pop</code><br><b>Output</b><br>The value returned by each <code>pop</code>, space separated (<code>-1</code> if the stack is empty).","Two Sum Pair Check":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br>Line 3: <code>target</code><br><b>Output</b><br><code>Yes</code> if two different elements sum to target, else <code>No</code>.","Array Max Element":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>The largest element.","Array Copy":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>Copy the array into a new array and print the copy, space separated.","String Reverse":"<b>Input</b><br>A string.<br><b>Output</b><br>The string reversed.","Count Vowels":"<b>Input</b><br>A string.<br><b>Output</b><br>The number of vowels (a, e, i, o, u, either case).","Kadane Algorithm Maximum Subarray":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>The maximum sum of a contiguous subarray.","Two Sum Pair":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br>Line 3: <code>target</code><br><b>Output</b><br>Indices <code>i j</code> (i &lt; j) of the first pair (smallest i, then smallest j) that sums to target, or <code>-1</code>.","Hollow Square Pattern":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>An n&times;n square of <code>*</code> with only the border filled (inside is spaces).","Number Pattern Pyramid":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>Row i prints the numbers 1..i separated by spaces.","Diamond Pattern":"<b>Input</b><br>An integer <code>n</code> (the widest row has 2n-1 stars).<br><b>Output</b><br>A diamond: rows with 1,3,..,2n-1,..,3,1 stars, centred with leading spaces.","Balanced Parentheses":"<b>Input</b><br>A string of brackets <code>()[]{}</code>.<br><b>Output</b><br><code>Balanced</code> or <code>Not Balanced</code>.","Next Greater Element":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>For each element, the next greater element to its right, or <code>-1</code>.","Next Smaller Element":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>For each element, the next smaller element to its right, or <code>-1</code>.","Evaluate Postfix Expression":"<b>Input</b><br>One line of space-separated tokens (integers and <code>+ - * /</code>).<br><b>Output</b><br>The value (division truncates toward zero).","Sliding Window Maximum":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>The maximum of every window of size k, space separated.","Generate Binary Numbers Using Queue":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>The first n binary numbers (1, 10, 11, 100, ...), space separated, generated with a queue.","Largest Rectangle in Histogram":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>The area of the largest rectangle in the histogram.","First Non-Repeating Character in Stream":"<b>Input</b><br>A lowercase string (a stream of characters).<br><b>Output</b><br>After each character, the first non-repeating character so far (<code>#</code> if none); print the results joined together.","Reverse Linked List":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br><b>Output</b><br>The list's values in reversed order, space separated.","Search in Linked List":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br>Line 3: <code>x</code><br><b>Output</b><br>The 0-based position of the first node equal to x, or <code>-1</code>.","Remove Duplicates":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: values of a sorted linked list<br><b>Output</b><br>The list with duplicate values removed, space separated.","Merge Two Sorted Lists":"<b>Input</b><br>Line 1: <code>n</code>, line 2: sorted list A<br>Line 3: <code>m</code>, line 4: sorted list B<br><b>Output</b><br>The merged sorted list, space separated.","Find Nth Node from End":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br>Line 3: <code>k</code> (1 &le; k &le; n)<br><b>Output</b><br>The value of the k-th node from the end.","Add Two Numbers as Lists":"<b>Input</b><br>Line 1: digits of number A in reverse order<br>Line 2: digits of number B in reverse order<br><b>Output</b><br>The sum's digits in reverse order, space separated (e.g. 342 is stored as <code>2 4 3</code>).","Insert at End":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br>Line 3: <code>x</code><br><b>Output</b><br>The list after inserting x at the end, space separated.","Delete a Node":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br>Line 3: <code>x</code><br><b>Output</b><br>The list after deleting the first node equal to x (unchanged if absent), space separated.","Create and Traverse Linked List":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>Build a linked list from the values and print them in order, space separated.","Swap Nodes in Pairs":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>The list after swapping every two adjacent nodes, space separated.","Rotate Linked List":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br>Line 3: <code>k</code><br><b>Output</b><br>The list rotated to the right by k places, space separated."};

Object.assign(FMT,{"Method Overloading Example":"<b>Input</b><br>Three integers <code>a b c</code>.<br><b>Output</b><br>Overload <code>add</code> for two and for three ints. Print <code>add(a,b)</code> on line 1 and <code>add(a,b,c)</code> on line 2.","Class and Object":"<b>Input</b><br>One line: <code>name age</code>.<br><b>Output</b><br>Create a <code>Student</code> class, make an object with new and print <code>Name: &lt;name&gt;, Age: &lt;age&gt;</code>.","Constructor Overloading":"<b>Input</b><br>Two integers <code>w h</code>.<br><b>Output</b><br>Class <code>Rectangle</code> has a no-arg constructor (1&times;1) and a <code>(w,h)</code> constructor. Print the area of the default object, then the area of the object built with w and h, separated by a space.","Static Variable":"<b>Input</b><br>An integer <code>n</code> (n &ge; 0).<br><b>Output</b><br>Create <code>n</code> objects of a class whose constructor increments a <b>static</b> counter. Print the counter value.","This Keyword":"<b>Input</b><br>One line: <code>name age</code>.<br><b>Output</b><br>Use <code>this</code> in a constructor whose parameters have the same names as the fields. Print <code>&lt;name&gt; is &lt;age&gt; years old</code>.","Inheritance Example":"<b>Input</b><br>A name.<br><b>Output</b><br><code>Dog extends Animal</code>. Print <code>&lt;name&gt; makes a sound</code> (inherited) then <code>&lt;name&gt; barks</code>.","Super Keyword Usage":"<b>Input</b><br>An integer <code>x</code>.<br><b>Output</b><br>Parent <code>display()</code> prints <code>Parent: x</code>. Child overrides it, calls <code>super.display()</code>, then prints <code>Child: x</code>.","Encapsulation with Getters Setters":"<b>Input</b><br>One line: <code>name age</code>.<br><b>Output</b><br>Use private fields and setters to store the values, then print them with getters as <code>name age</code>.","Abstract Class":"<b>Input</b><br>Two integers <code>w h</code>.<br><b>Output</b><br>Abstract class <code>Shape</code> with abstract <code>area()</code>; <code>Rectangle extends Shape</code>. Print the area.","Interface Implementation":"<b>Input</b><br>Two integers <code>a b</code>.<br><b>Output</b><br>Interface <code>Operation</code> with <code>int apply(int a,int b)</code>. Implement it as multiplication and print the result.","Exception Handling":"<b>Input</b><br>Two integers <code>a b</code>.<br><b>Output</b><br>Print integer <code>a / b</code>. Use try/catch: if b is 0 print <code>Cannot divide by zero</code>.","ArrayList Basics":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> integers<br><b>Output</b><br>Add the numbers to an <code>ArrayList</code>. Print <code>size sum</code>.","Method Overriding":"<b>Input</b><br>A word: <code>dog</code>, <code>cat</code> or anything else.<br><b>Output</b><br>Parent <code>Animal.sound()</code> prints <code>Animal sound</code>; <code>Dog</code> overrides it to print <code>Woof</code>, <code>Cat</code> to print <code>Meow</code>. Create the object according to the word (other words &rarr; plain Animal), store it in an <code>Animal</code> reference and call <code>sound()</code>.","This vs Super":"<b>Input</b><br>Two integers <code>a b</code>.<br><b>Output</b><br>Parent has field <code>x = a</code>, Child has field <code>x = b</code>. Inside Child print <code>this.x=&lt;b&gt; super.x=&lt;a&gt;</code>.","IS-A vs HAS-A":"<b>Input</b><br>One line: <code>brand hp</code>.<br><b>Output</b><br><code>Car extends Vehicle</code> (IS-A) and a Car has an <code>Engine</code> object (HAS-A). Print <code>&lt;brand&gt; has an engine of &lt;hp&gt; HP</code>.","Polymorphism with Method Overriding":"<b>Input</b><br><code>square s</code> or <code>rect w h</code>.<br><b>Output</b><br>Base <code>Shape.area()</code> is overridden by <code>Square</code> and <code>Rectangle</code>. Print the area using a <code>Shape</code> reference.","Interface vs Abstract Class":"<b>Input</b><br>A name.<br><b>Output</b><br>Interface <code>Flyable</code> has <code>fly()</code>; abstract class <code>Bird</code> has a concrete <code>describe()</code>. Print <code>&lt;name&gt; can fly</code> then <code>&lt;name&gt; is a bird</code>.","Constructor Chaining":"<b>Input</b><br>Four integers <code>s l w h</code>.<br><b>Output</b><br><code>Box(s)</code> calls <code>this(s,s,s)</code>; <code>Box(l,w,h)</code> is the main constructor. Print the volume of <code>Box(s)</code> and of <code>Box(l,w,h)</code>, separated by a space.","Real World OOP Design":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: <code>deposit x</code> or <code>withdraw x</code><br><b>Output</b><br>Use a <code>BankAccount</code> class starting at 0. If a withdrawal exceeds the balance print <code>Insufficient funds</code> (balance unchanged). At the end print <code>Balance: &lt;b&gt;</code>.","String Buffer vs Builder":"<b>Input</b><br>A word.<br><b>Output</b><br>Reverse it using <code>StringBuffer</code> and print it. Then use <code>StringBuilder</code> to print the word with <code>!</code> appended.","Multiple Inheritance via Interfaces":"<b>Input</b><br>Two integers <code>a b</code>.<br><b>Output</b><br>Interfaces <code>Adder</code> and <code>Multiplier</code>; <code>class Calc implements Adder, Multiplier</code>. Print <code>a+b</code> then <code>a*b</code> on separate lines.","Method Overriding Rules":"<b>Input</b><br>Two integers <code>base bonus</code>.<br><b>Output</b><br><code>Employee.getSalary()</code> returns base; <code>Manager</code> overrides it (use <code>@Override</code>) returning base + bonus. Print the Employee salary then the Manager salary separated by a space.","Encapsulation with Validation":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: a value<br><b>Output</b><br>For each value call a setter on a private <code>balance</code> (starts at 0). A negative value is rejected: print <code>Invalid</code>. At the end print <code>Balance: &lt;b&gt;</code>.","Interface Default Methods":"<b>Input</b><br>A name.<br><b>Output</b><br>Interface <code>Greeter</code> has an abstract <code>name()</code> and a <code>default</code> method <code>greet()</code> returning <code>Hello, &lt;name&gt;</code>. Implement it and print <code>greet()</code>.","Polymorphism with Interfaces":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: <code>n</code> words, each <code>car</code> or <code>bike</code><br><b>Output</b><br>Interface <code>Vehicle</code> with <code>wheels()</code> (car = 4, bike = 2). Print the total number of wheels.","Static vs Instance Members":"<b>Input</b><br>An integer <code>n</code> (n &ge; 1).<br><b>Output</b><br>Create <code>n</code> objects; each gets an instance <code>id</code> from a static counter (1, 2, ...). Print the ids separated by spaces, then on a new line print the static counter.","Super Constructor Call":"<b>Input</b><br>One line: <code>name age</code>.<br><b>Output</b><br><code>Student extends Person</code> and calls <code>super(name)</code>. Print <code>Person: &lt;name&gt;</code> then <code>Student age: &lt;age&gt;</code>.","Object Composition Example":"<b>Input</b><br>One line: <code>cpu ram</code>.<br><b>Output</b><br>A <code>Computer</code> contains a <code>Processor</code> object. Print <code>Computer with &lt;cpu&gt; and &lt;ram&gt;GB RAM</code>.","Abstract vs Interface Comparison":"<b>Input</b><br>A name.<br><b>Output</b><br>Abstract class <code>Vehicle</code> with abstract <code>start()</code>; interface <code>Refuelable</code> with <code>refuel()</code>. A class extends one and implements the other. Print <code>&lt;name&gt; started</code> then <code>&lt;name&gt; refueled</code>.","Text Justification":"<b>Input</b><br>Line 1: space-separated words<br>Line 2: <code>maxWidth</code><br><b>Output</b><br>Fully justify the text: every line has exactly <code>maxWidth</code> characters, extra spaces are distributed left-heavy, the last line and single-word lines are left-justified. Print one line per row (trailing spaces are ignored by the judge).","Copy List with Random Pointers":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: node values<br>Line 3: for each node the index of its <code>random</code> target (<code>-1</code> = null)<br><b>Output</b><br>Deep-copy the list. Print one line per node of the <b>copy</b>: <code>value randomIndex</code>.","Flatten Multilevel List":"<b>Input</b><br>Line 1: <code>m</code> (number of sorted chains)<br>Next <code>m</code> lines: <code>k v1 ... vk</code> (a sorted chain of k values)<br><b>Output</b><br>Flatten all chains into one sorted list and print it separated by spaces.","Queue Using Stacks":"<b>Input</b><br>Line 1: <code>q</code><br>Next <code>q</code> lines: <code>push x</code>, <code>pop</code> or <code>peek</code><br><b>Output</b><br>Implement a FIFO queue with two stacks. Print the result of each <code>pop</code>/<code>peek</code>, separated by spaces (<code>-1</code> if empty).","Stack Using Queues":"<b>Input</b><br>Line 1: <code>q</code><br>Next <code>q</code> lines: <code>push x</code>, <code>pop</code> or <code>top</code><br><b>Output</b><br>Implement a LIFO stack with queues. Print the result of each <code>pop</code>/<code>top</code>, separated by spaces (<code>-1</code> if empty).","Implement Circular Queue":"<b>Input</b><br>Line 1: <code>k</code> (capacity)<br>Line 2: <code>q</code><br>Next <code>q</code> lines: <code>enQueue x</code>, <code>deQueue</code>, <code>Front</code>, <code>Rear</code>, <code>isEmpty</code> or <code>isFull</code><br><b>Output</b><br>Print the result of every command separated by spaces: <code>enQueue</code>/<code>deQueue</code> &rarr; <code>true</code>/<code>false</code>; <code>Front</code>/<code>Rear</code> &rarr; value or <code>-1</code>; <code>isEmpty</code>/<code>isFull</code> &rarr; <code>true</code>/<code>false</code>.","Priority Queue with Heap":"<b>Input</b><br>Line 1: <code>q</code><br>Next <code>q</code> lines: <code>I x</code> (insert) or <code>E</code> (extract the <b>maximum</b>)<br><b>Output</b><br>Print the result of each <code>E</code>, separated by spaces (<code>-1</code> if empty).","Queue Implementation with Array":"<b>Input</b><br>Line 1: <code>k</code> (array size)<br>Line 2: <code>q</code><br>Next <code>q</code> lines: <code>enqueue x</code>, <code>dequeue</code> or <code>front</code><br><b>Output</b><br>Use a fixed array of size k. Print <code>Overflow</code> when enqueue fails, <code>Underflow</code> when dequeue/front hits an empty queue, otherwise the dequeued/front value. Print results separated by spaces (enqueue prints nothing on success).","Deque Implementation":"<b>Input</b><br>Line 1: <code>q</code><br>Next <code>q</code> lines: <code>pushFront x</code>, <code>pushBack x</code>, <code>popFront</code> or <code>popBack</code><br><b>Output</b><br>Print the value returned by each pop, separated by spaces (<code>-1</code> if empty).","Queue Reconstruction by Height":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: <code>h k</code> (height, number of people in front who are at least as tall)<br><b>Output</b><br>Reconstruct the queue and print one <code>h k</code> per line, front to back.","Implement Two Stacks in One Array":"<b>Input</b><br>Line 1: <code>n</code> (array size)<br>Line 2: <code>q</code><br>Next <code>q</code> lines: <code>push1 x</code>, <code>push2 x</code>, <code>pop1</code> or <code>pop2</code><br><b>Output</b><br>Both stacks share one array of size n. Print <code>Overflow</code> when the array is full on a push, and for each pop the value (<code>-1</code> if that stack is empty). Separate results with spaces."});

cending; <code>None</code> if none.","Next Greater Element I":"<b>Input</b><br>Line 1: <code>n m</code><br>Line 2: <code>nums1</code> (n values, subset of nums2)<br>Line 3: <code>nums2</code> (m distinct values)<br><b>Output</b><br>For each value of nums1, the next greater element to its right in nums2, or <code>-1</code>.","Max Consecutive Ones":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: 0/1 values<br><b>Output</b><br>The maximum run of consecutive 1s.","Array Partition":"<b>Input</b><br>Line 1: <code>2n</code><br>Line 2: <code>2n</code> integers<br><b>Output</b><br>Pair the numbers into n pairs to maximize the sum of <code>min(a,b)</code> over all pairs; print that sum.","Non-decreasing Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can become non-decreasing by changing at most one element, else <code>false</code>.","Largest Number At Least Twice of Others":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: non-negative integers<br><b>Output</b><br>The index of the largest element if it is at least twice every other element, else <code>-1</code>.","Height Checker":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: heights<br><b>Output</b><br>The number of positions where the height differs from the sorted order.","Monotonic Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if the array is entirely non-increasing or non-decreasing.","Replace Elements with Greatest Element on Right Side":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Replace each element by the greatest element to its right; the last becomes <code>-1</code>.","Last Stone Weight":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: stone weights<br><b>Output</b><br>Repeatedly smash the two heaviest stones (equal &rarr; both vanish; else the difference remains). Print the last stone's weight, or <code>0</code>.","Longest Harmonious Subsequence":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Length of the longest subsequence whose max and min differ by exactly 1.","Distribute Candies":"<b>Input</b><br>Line 1: <code>n</code> (even)<br>Line 2: candy types<br><b>Output</b><br>Alice may eat <code>n/2</code> candies; print the maximum number of different types she can eat.","Lemonade Change":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: bills (5, 10 or 20)<br><b>Output</b><br>Each lemonade costs 5 and you start with no change. <code>true</code> if you can give correct change to every customer.","Kth Missing Positive Number":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: sorted distinct positive integers<br>Line 3: <code>k</code><br><b>Output</b><br>The k-th positive integer missing from the array.","Sum of All Odd Length Subarrays":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Sum of all subarrays of odd length.","Count Odd Numbers in an Interval Range":"<b>Input</b><br>Two integers <code>low high</code>.<br><b>Output</b><br>The number of odd integers in <code>[low, high]</code>.","Kids With the Greatest Number of Candies":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: candies<br>Line 3: <code>extra</code><br><b>Output</b><br>For each kid, <code>true</code> if giving them all extra candies makes them have the most (ties count). Space separated.","Find Numbers with Even Number of Digits":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>How many numbers have an even number of digits.","Duplicate Zeros":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Duplicate every zero, shifting the rest right, and keep only the first <code>n</code> elements. Print the array.","Check if Array Is Sorted and Rotated":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if the array was originally sorted ascending and then rotated (possibly by 0).","Maximum Product Object.assign(FMT,{"Remove Element":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br>Line 3: <code>val</code><br><b>Output</b><br>Remove every occurrence of <code>val</code>; print the remaining elements in their original order, or <code>Empty</code>.","Remove Duplicates from Sorted Array II":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: sorted array<br><b>Output</b><br>Keep each value at most twice; print the resulting array.","Maximum Gap":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The maximum difference between successive elements of the sorted array (<code>0</code> if n &lt; 2).","H-Index":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: citation counts<br><b>Output</b><br>The largest <code>h</code> such that the researcher has at least h papers with at least h citations each.","Wiggle Subsequence":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Length of the longest subsequence whose successive differences strictly alternate in sign.","Increasing Triplet Subsequence":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if there are indices <code>i&lt;j&lt;k</code> with <code>a[i]&lt;a[j]&lt;a[k]</code>.","Find K Closest Elements":"<b>Input</b><br>Line 1: <code>n k x</code><br>Line 2: sorted array<br><b>Output</b><br>The <code>k</code> elements closest to <code>x</code> (ties: the smaller value wins), printed ascending.","Longest Continuous Increasing Subsequence":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Length of the longest strictly increasing run of consecutive elements.","Shortest Unsorted Continuous Subarray":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Length of the shortest subarray which, if sorted, makes the whole array sorted (<code>0</code> if already sorted).","Degree of an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The degree is the highest frequency of any value. Print the length of the shortest subarray with the same degree.","Max Chunks To Make Sorted":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: a permutation of <code>0..n-1</code><br><b>Output</b><br>Split into the most chunks that, sorted individually and concatenated, give the sorted array. Print the chunk count.","Can Make Arithmetic Progression From Sequence":"<b>Input</b><br>Line 1: <code>n</code> (&ge; 2)<br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can be rearranged into an arithmetic progression.","Count Number of Teams":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: distinct ratings<br><b>Output</b><br>Count triples <code>i&lt;j&lt;k</code> with ratings strictly increasing or strictly decreasing.","Number of Provinces":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: adjacency matrix (<code>1</code> = directly connected)<br><b>Output</b><br>The number of connected groups of cities.","Max Area of Island":"<b>Input</b><br>Line 1: <code>r c</code><br>Next <code>r</code> lines: 0/1 grid<br><b>Output</b><br>The area of the largest 4-connected island of 1s (<code>0</code> if none).","Flood Fill":"<b>Input</b><br>Line 1: <code>r c sr sc color</code><br>Next <code>r</code> lines: the image<br><b>Output</b><br>Recolor the 4-connected region of the starting pixel (same original colour) with <code>color</code>. Print the image.","Rotting Oranges":"<b>Input</b><br>Line 1: <code>r c</code><br>Next <code>r</code> lines: 0 empty, 1 fresh, 2 rotten<br><b>Output</b><br>Each minute a fresh orange next to a rotten one (4 directions) rots. Print the minutes until none are fresh, or <code>-1</code> if impossible.","01 Matrix":"<b>Input</b><br>Line 1: <code>r c</code> (at least one 0)<br>Next <code>r</code> lines: 0/1 grid<br><b>Output</b><br>For each cell the distance to the nearest 0 (moving in 4 directions).","Number of Enclaves":"<b>Input</b><br>Line 1: <code>r c</code><br>Next <code>r</code> lines: 0 water, 1 land<br><b>Output</b><br>Count land cells that cannot walk (4 directions) off the grid boundary.","Game of Life":"<b>Input</b><br>Line 1: <code>r c</code><br>Next <code>r</code> lines: 0 dead / 1 live<br><b>Output</b><br>Apply one step of Conway's Game of Life (8 neighbours) and print the board.","Word Search":"<b>Input</b><br>Line 1: <code>r c</code><br>Next <code>r</code> lines: rows of letters (no spaces)<br>Last line: the word<br><b>Output</b><br><code>true</code> if the word can be traced through adjacent (4 directions) cells without reusing a cell.","Longest Increasing Path in a Matrix":"<b>Input</b><br>Line 1: <code>r c</code><br>Next <code>r</code> lines: the matrix<br><b>Output</b><br>Length of the longest strictly increasing path moving in 4 directions.","Minimum Falling Path Sum":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: an <code>n&times;n</code> matrix<br><b>Output</b><br>A falling path starts in the top row and each step moves to the row below, same column or one column left/right. Print the minimum sum.","Triangle":"<b>Input</b><br>Line 1: <code>n</code> (rows)<br>Next <code>n</code> lines: row <code>i</code> has <code>i</code> numbers<br><b>Output</b><br>Minimum path sum from top to bottom, moving to an adjacent number on the next row.","Palindrome Partitioning II":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>The minimum number of cuts so that every part is a palindrome.","Predict the Winner":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: scores<br><b>Output</b><br>Two players alternately take a number from either end of the array (player 1 first). <code>true</code> if player 1 can end with at least as many points as player 2 (both play optimally).","Domino and Tromino Tiling":"<b>Input</b><br>An integer <code>n</code> (1 &le; n &le; 30).<br><b>Output</b><br>The number of ways to tile a <code>2&times;n</code> board with dominoes and L-trominoes, modulo 1000000007.","Knight Dialer":"<b>Input</b><br>An integer <code>n</code> (1 &le; n &le; 40).<br><b>Output</b><br>A chess knight moves on a phone keypad (digits 0-9). Count distinct numbers of length <code>n</code> it can dial, modulo 1000000007.","Number of Dice Rolls With Target Sum":"<b>Input</b><br>Three integers <code>n k target</code>.<br><b>Output</b><br>The number of ways to roll <code>n</code> dice with <code>k</code> faces so the sum is <code>target</code>, modulo 1000000007.","Minimum Cost For Tickets":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: sorted travel days (1..365)<br>Line 3: costs of 1-day, 7-day and 30-day passes<br><b>Output</b><br>The minimum total cost to cover every travel day.","Longest String Chain":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: words<br><b>Output</b><br>A chain is a sequence where each word is the previous one plus exactly one inserted letter. Print the length of the longest chain.","Maximum Length of Pair Chain":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: pairs <code>a b</code> (a &lt; b)<br><b>Output</b><br>Pair <code>(c,d)</code> follows <code>(a,b)</code> if <code>b &lt; c</code>. Print the length of the longest chain.","Russian Doll Envelopes":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: <code>width height</code><br><b>Output</b><br>An envelope fits inside another only if both width and height are strictly smaller. Print the maximum nesting depth.","Last Stone Weight II":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: stones<br><b>Output</b><br>Repeatedly smash any two stones (equal &rarr; both vanish, else the difference remains). Print the smallest possible weight of the last stone (<code>0</code> if none).","Arithmetic Slices":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count contiguous subarrays of length &ge; 3 whose consecutive differences are all equal.","Maximum Profit in Job Scheduling":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: <code>start end profit</code><br><b>Output</b><br>Choose non-overlapping jobs (a job may start at another's end time) to maximize total profit.","Best Time to Buy and Sell Stock III":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: prices<br><b>Output</b><br>At most two transactions (sell before you buy again). Print the maximum profit.","Best Time to Buy and Sell Stock IV":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: prices<br><b>Output</b><br>At most <code>k</code> transactions. Print the maximum profit.","Best Time to Buy and Sell Stock with Transaction Fee":"<b>Input</b><br>Line 1: <code>n fee</code><br>Line 2: prices<br><b>Output</b><br>Unlimited transactions, paying <code>fee</code> per transaction. Print the maximum profit.","Paint Fence":"<b>Input</b><br>Two integers <code>n k</code> (posts, colours).<br><b>Output</b><br>Paint each of the <code>n</code> posts with one of <code>k</code> colours so that no <b>three</b> adjacent posts share a colour. Print the number of ways.","Combination Sum IV":"<b>Input</b><br>Line 1: <code>n target</code><br>Line 2: distinct positive integers<br><b>Output</b><br>The number of ordered sequences of numbers (reuse allowed) that sum to <code>target</code>.","Longest Substring with At Most Two Distinct Characters":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>Length of the longest substring with at most two distinct characters.","Longest Substring with At Most K Distinct Characters":"<b>Input</b><br>Line 1: string<br>Line 2: <code>k</code><br><b>Output</b><br>Length of the longest substring with at most k distinct characters.","Find All Anagrams in a String":"<b>Input</b><br>Line 1: string <code>s</code><br>Line 2: string <code>p</code><br><b>Output</b><br>The start indices of all substrings of <code>s</code> that are anagrams of <code>p</code>, ascending, space separated; <code>None</code> if there are none.","Longest Substring with At Least K Repeating Characters":"<b>Input</b><br>Line 1: string<br>Line 2: <code>k</code><br><b>Output</b><br>Length of the longest substring in which every character appears at least k times.","Minimum Add to Make Parentheses Valid":"<b>Input</b><br>A string of <code>(</code> and <code>)</code>.<br><b>Output</b><br>The minimum number of parentheses to insert to make the string valid.","Score of Parentheses":"<b>Input</b><br>A balanced parentheses string.<br><b>Output</b><br><code>()</code> = 1, <code>AB</code> = A+B, <code>(A)</code> = 2&times;A. Print the score.","Longest Valid Parentheses":"<b>Input</b><br>A string of <code>(</code> and <code>)</code>.<br><b>Output</b><br>Length of the longest well-formed (valid) parentheses substring.","Valid Parenthesis String":"<b>Input</b><br>A string of <code>(</code>, <code>)</code> and <code>*</code> (a star may act as <code>(</code>, <code>)</code> or empty).<br><b>Output</b><br><code>true</code> if the string can be valid.","Check If a String Contains All Binary Codes of Size K":"<b>Input</b><br>Line 1: a binary string<br>Line 2: <code>k</code><br><b>Output</b><br><code>true</code> if every binary code of length k is a substring.","Maximum Number of Vowels in a Substring of Given Length":"<b>Input</b><br>Line 1: string<br>Line 2: <code>k</code><br><b>Output</b><br>The maximum number of vowels (<code>aeiou</code>) in any substring of length k.","Consecutive Characters":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>Length of the longest substring made of one repeated character.","Evaluate Reverse Polish Notation":"<b>Input</b><br>One line of space-separated tokens (integers and <code>+ - * /</code>).<br><b>Output</b><br>The value; division truncates toward zero.","Simplify Path":"<b>Input</b><br>An absolute Unix path.<br><b>Output</b><br>The canonical path: single slashes, <code>.</code> ignored, <code>..</code> goes up one level, no trailing slash (root is <code>/</code>).","Compare Version Numbers":"<b>Input</b><br>Two lines: version strings made of numbers separated by dots.<br><b>Output</b><br><code>-1</code> if the first is smaller, <code>1</code> if larger, <code>0</code> if equal (missing parts count as 0; leading zeros ignored).","Reverse Words in a String":"<b>Input</b><br>One line of words separated by one or more spaces (may have leading/trailing spaces).<br><b>Output</b><br>The words in reverse order, separated by a single space.","Word Pattern":"<b>Input</b><br>Line 1: pattern of letters<br>Line 2: words<br><b>Output</b><br><code>true</code> if there is a one-to-one mapping between pattern letters and words.","Find the Index of the First Occurrence in a String":"<b>Input</b><br>Line 1: haystack<br>Line 2: needle<br><b>Output</b><br>The index of the first occurrence of needle in haystack, or <code>-1</code>.","Rotate String":"<b>Input</b><br>Two lines <code>s</code> and <code>goal</code>.<br><b>Output</b><br><code>true</code> if <code>s</code> can become <code>goal</code> after some number of left shifts.","Repeated String Match":"<b>Input</b><br>Two lines <code>a</code> and <code>b</code>.<br><b>Output</b><br>The minimum number of times <code>a</code> must be repeated so that <code>b</code> is a substring of it, or <code>-1</code>.","Number of Segments in a String":"<b>Input</b><br>One line of text.<br><b>Output</b><br>The number of segments (maximal runs of non-space characters).","Count Binary Substrings":"<b>Input</b><br>A binary string.<br><b>Output</b><br>Count non-empty substrings that have equal numbers of 0s and 1s with all 0s grouped together and all 1s grouped together.","Minimum Time Difference":"<b>Input</b><br>Line 1: <code>n</code> (&ge; 2)<br>Next <code>n</code> lines: times <code>HH:MM</code><br><b>Output</b><br>The minimum difference in minutes between any two times (the clock wraps at midnight).","Goat Latin":"<b>Input</b><br>A sentence of words separated by single spaces.<br><b>Output</b><br>Words starting with a vowel get <code>ma</code> appended; otherwise move the first letter to the end then append <code>ma</code>. Finally append <code>a</code> repeated by the word's 1-based position.","Positions of Large Groups":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>A group is a run of the same letter with length &ge; 3. Print each group's <code>start end</code> (inclusive indices) on its own line, or <code>None</code>.","Reverse Prefix of Word":"<b>Input</b><br>Line 1: word<br>Line 2: a character <code>ch</code><br><b>Output</b><br>Reverse the prefix ending at the first occurrence of ch (inclusive); if ch is absent print the word unchanged.","Ugly Number II":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>The n-th ugly number (positive integers whose only prime factors are 2, 3, 5; 1 is the first).","Total Hamming Distance":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: numbers<br><b>Output</b><br>The sum of Hamming distances between all pairs of numbers.","Nth Digit":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>The n-th digit (1-indexed) of the sequence 123456789101112...","Integer Replacement":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>If n is even replace it with n/2; if odd with n+1 or n-1. Print the minimum replacements to reach 1.","Bulb Switcher":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br><code>n</code> bulbs start off. In round <code>i</code> toggle every i-th bulb. Print how many are on after n rounds.","Water and Jug Problem":"<b>Input</b><br>Three integers <code>x y z</code>.<br><b>Output</b><br>With jugs of capacity x and y litres, <code>true</code> if you can measure exactly z litres in total.","Count Numbers with Unique Digits":"<b>Input</b><br>An integer <code>n</code> (0 &le; n &le; 5).<br><b>Output</b><br>The count of integers <code>x</code> with <code>0 &le; x &lt; 10<sup>n</sup></code> that have no repeated digit.","Smallest Integer Divisible by K":"<b>Input</b><br>An integer <code>k</code>.<br><b>Output</b><br>The length of the smallest positive integer made only of the digit 1 that is divisible by k, or <code>-1</code>.","Fraction to Recurring Decimal":"<b>Input</b><br>Two integers <code>numerator denominator</code> (denominator &ne; 0).<br><b>Output</b><br>The fraction as a decimal string; wrap a repeating part in parentheses.","Factorial Trailing Zeroes":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>The number of trailing zeroes in <code>n!</code>.","Largest Time for Given Digits":"<b>Input</b><br>Four digits on one line.<br><b>Output</b><br>The latest valid 24-hour time <code>HH:MM</code> that uses each digit exactly once, or <code>None</code>.","Day of the Year":"<b>Input</b><br>A date <code>YYYY-MM-DD</code>.<br><b>Output</b><br>The day number of the year (Jan 1 = 1).","Day of the Week":"<b>Input</b><br>Three integers <code>day month year</code>.<br><b>Output</b><br>The weekday name (<code>Sunday</code> ... <code>Saturday</code>).","Number of Days Between Two Dates":"<b>Input</b><br>Two lines: dates <code>YYYY-MM-DD</code>.<br><b>Output</b><br>The absolute number of days between them.","Self Dividing Numbers":"<b>Input</b><br>Two integers <code>left right</code>.<br><b>Output</b><br>Every number in <code>[left, right]</code> divisible by each of its digits (no digit 0), space separated.","Complex Number Multiplication":"<b>Input</b><br>Two lines in the form <code>a+bi</code> (b may be negative, e.g. <code>1+-1i</code>).<br><b>Output</b><br>The product in the same form.","Fraction Addition and Subtraction":"<b>Input</b><br>An expression of fractions such as <code>-1/2+1/3</code>.<br><b>Output</b><br>The result as an irreducible fraction <code>n/d</code> (integers print as <code>n/1</code>).","Rectangle Overlap":"<b>Input</b><br>Two lines <code>x1 y1 x2 y2</code> (bottom-left and top-right corners).<br><b>Output</b><br><code>true</code> if the rectangles overlap with positive area (touching edges do not count).","Rectangle Area":"<b>Input</b><br>Two lines <code>x1 y1 x2 y2</code> (bottom-left, top-right corner of each rectangle).<br><b>Output</b><br>The total area covered by the two rectangles.","Monotone Increasing Digits":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br>The largest integer &le; n whose digits are in non-decreasing order.","Add to Array-Form of Integer":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: digits (most significant first)<br>Line 3: <code>k</code><br><b>Output</b><br>The digits of <code>number + k</code>, space separated.","Binary Prefix Divisible By 5":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: bits<br><b>Output</b><br>For each prefix read as a binary number, <code>true</code> if divisible by 5. Space separated.","Sum of Subarray Minimums":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Sum of <code>min(subarray)</code> over all contiguous subarrays, modulo 1000000007.","Sum of Subarray Ranges":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Sum over all subarrays of (max - min).","Valid Square":"<b>Input</b><br>Four lines <code>x y</code> (the points, in any order).<br><b>Output</b><br><code>true</code> if they form a square with positive area.","Valid Triangle Number":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: side lengths<br><b>Output</b><br>The number of triplets (by index) that can form a triangle with positive area.","Maximum Number of Balls in a Box":"<b>Input</b><br>Two integers <code>low high</code>.<br><b>Output</b><br>Balls numbered <code>low..high</code> go into the box numbered by their digit sum. Print the largest number of balls in one box.","Count Good Triplets":"<b>Input</b><br>Line 1: <code>n a b c</code><br>Line 2: array<br><b>Output</b><br>Count triples <code>i&lt;j&lt;k</code> with <code>|ai-aj|&le;a</code>, <code>|aj-ak|&le;b</code> and <code>|ai-ak|&le;c</code>.","Minimum Absolute Difference":"<b>Input</b><br>Line 1: <code>n</code> (&ge; 2)<br>Line 2: distinct integers<br><b>Output</b><br>All pairs <code>a b</code> (a &lt; b) with the minimum absolute difference, one per line, in ascending order.","Sort Integers by The Number of 1 Bits":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Sort by the number of 1 bits ascending; ties by value ascending.","Rank Transform of an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Replace each element with its rank (smallest value = 1; equal values share a rank).","Check If Array Pairs Are Divisible by k":"<b>Input</b><br>Line 1: <code>n k</code> (n even)<br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can be split into pairs whose sums are all divisible by k.","Find Original Array From Doubled Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>If the array is a doubled array (the original plus the doubles of its elements, shuffled), print the original array sorted ascending; otherwise <code>None</code>.","Maximum Score After Splitting a String":"<b>Input</b><br>A binary string of length &ge; 2.<br><b>Output</b><br>Split into two non-empty parts; score = zeros in the left + ones in the right. Print the maximum score."});

Object.assign(FMT,{"Find First and Last Position of Element in Sorted Array":"<b>Input</b><br>Line 1: <code>n target</code><br>Line 2: sorted array<br><b>Output</b><br><code>first last</code> index of target, or <code>-1 -1</code>.","Kth Largest Element in an Array":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>The k-th largest element (counting duplicates).","Intersection of Two Arrays II":"<b>Input</b><br>Line 1: array A<br>Line 2: array B<br><b>Output</b><br>Elements in both arrays with multiplicity (min of counts), ascending; <code>Empty</code> if none.","Minimum Moves to Equal Array Elements":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>One move increments <code>n-1</code> elements by 1. Print the minimum moves to make all equal.","Minimum Moves to Equal Array Elements II":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>One move changes one element by 1. Print the minimum moves to make all equal.","Continuous Subarray Sum":"<b>Input</b><br>Line 1: <code>n k</code> (k &ge; 1)<br>Line 2: non-negative array<br><b>Output</b><br><code>true</code> if some subarray of length &ge; 2 has a sum that is a multiple of k.","Contiguous Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: 0/1 array<br><b>Output</b><br>Length of the longest contiguous subarray with equal numbers of 0s and 1s.","K-diff Pairs in an Array":"<b>Input</b><br>Line 1: <code>n k</code> (k &ge; 0)<br>Line 2: array<br><b>Output</b><br>The number of unique pairs <code>(a,b)</code> with <code>|a-b| = k</code>.","Array Nesting":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: a permutation of <code>0..n-1</code><br><b>Output</b><br>The longest set <code>{a[i], a[a[i]], ...}</code> before a repeat; print its size.","Maximum Average Subarray I":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>The maximum average of any contiguous subarray of length <code>k</code>, with 5 decimals.","Peak Index in a Mountain Array":"<b>Input</b><br>Line 1: <code>n</code> (&ge; 3)<br>Line 2: a mountain array (strictly up, then strictly down)<br><b>Output</b><br>The index of the peak.","Partition Array into Disjoint Intervals":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Split into <code>left</code> and <code>right</code> (both non-empty) with every element of left &le; every element of right, left as short as possible. Print the length of left.","Minimum Increment to Make Array Unique":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>One move increments one element by 1. Print the minimum moves to make all elements distinct.","Array of Doubled Pairs":"<b>Input</b><br>Line 1: <code>n</code> (even)<br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can be reordered so that <code>a[2i+1] = 2*a[2i]</code> for every i.","N-Repeated Element in Size 2N Array":"<b>Input</b><br>Line 1: <code>2N</code><br>Line 2: array with <code>N+1</code> distinct values, one of them repeated <code>N</code> times<br><b>Output</b><br>The repeated value.","Subarray Sums Divisible by K":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Count non-empty subarrays whose sum is divisible by k.","Maximize Sum Of Array After K Negations":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Exactly k times, pick an index and negate its value (the same index may be picked again). Print the largest possible sum.","Partition Array Into Three Parts With Equal Sum":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can be split into three non-empty contiguous parts with equal sums.","Missing Element in Sorted Array":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: strictly increasing array<br><b>Output</b><br>The k-th integer, counted from <code>a[0]</code>, that is missing from the array.","Relative Sort Array":"<b>Input</b><br>Line 1: <code>n m</code><br>Line 2: arr1<br>Line 3: arr2 (distinct, all appear in arr1)<br><b>Output</b><br>Sort arr1 so elements follow the order of arr2; elements not in arr2 go at the end in ascending order.","Check If a Number Is Majority Element in a Sorted Array":"<b>Input</b><br>Line 1: <code>n target</code><br>Line 2: sorted array<br><b>Output</b><br><code>true</code> if target appears more than n/2 times.","Element Appearing More Than 25% In Sorted Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: sorted array with exactly one value occurring &gt; 25% of the time<br><b>Output</b><br>That value.","Divide Array in Sets of K Consecutive Numbers":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can be split into groups of <code>k</code> consecutive numbers.","XOR Queries of a Subarray":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br>Line 3: <code>q</code><br>Next <code>q</code> lines: <code>l r</code> (0-indexed, inclusive)<br><b>Output</b><br>The XOR of <code>a[l..r]</code> for each query, space separated.","Find the Distance Value Between Two Arrays":"<b>Input</b><br>Line 1: <code>n m d</code><br>Line 2: arr1<br>Line 3: arr2<br><b>Output</b><br>Count elements <code>a</code> of arr1 such that no <code>b</code> in arr2 has <code>|a-b| &le; d</code>.","Create Target Array in the Given Order":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: nums<br>Line 3: index (<code>index[i] &le; i</code>)<br><b>Output</b><br>Insert <code>nums[i]</code> at position <code>index[i]</code> for i = 0..n-1; print the final array.","Find Lucky Integer in an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>A lucky integer appears exactly as many times as its value. Print the largest, or <code>-1</code>.","Maximum Product of Two Elements in an Array":"<b>Input</b><br>Line 1: <code>n</code> (&ge; 2)<br>Line 2: array<br><b>Output</b><br>The maximum of <code>(a[i]-1)*(a[j]-1)</code> over <code>i != j</code>.","The k Strongest Values in an Array":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>With median <code>m</code> (the element at index <code>(n-1)/2</code> of the sorted array), <code>a</code> is stronger than <code>b</code> if <code>|a-m| &gt; |b-m|</code>, or equal distance and <code>a &gt; b</code>. Print the k strongest values, strongest first.","XOR Operation in an Array":"<b>Input</b><br>Two integers <code>n start</code>.<br><b>Output</b><br>Let <code>nums[i] = start + 2*i</code> (i = 0..n-1). Print the XOR of all elements.","Make Two Arrays Equal by Reversing Subarrays":"<b>Input</b><br>Line 1: array <code>target</code><br>Line 2: array <code>arr</code> (same length)<br><b>Output</b><br><code>true</code> if <code>arr</code> can become <code>target</code> by reversing subarrays any number of times.","Find the Winner of an Array Game":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: distinct integers<br><b>Output</b><br>Each round compares the first two elements; the larger stays at the front and the smaller goes to the end. The game ends when one integer wins <code>k</code> rounds in a row. Print the winner.","Minimum Operations to Make Array Equal":"<b>Input</b><br>An integer <code>n</code>.<br><b>Output</b><br><code>arr[i] = 2*i+1</code>. One operation moves 1 from one element to another. Print the minimum operations to make all elements equal.","Special Array With X Elements Greater Than or Equal X":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Find <code>x</code> such that exactly <code>x</code> elements are &ge; <code>x</code>; print it or <code>-1</code>.","Mean of Array After Removing Some Elements":"<b>Input</b><br>Line 1: <code>n</code> (a multiple of 20)<br>Line 2: array<br><b>Output</b><br>Remove the smallest 5% and largest 5% of elements; print the mean of the rest with 5 decimals.","Sort Array by Increasing Frequency":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Sort by frequency ascending; equal frequencies by value descending.","Check Array Formation Through Concatenation":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: distinct array<br>Line 3: <code>m</code><br>Next <code>m</code> lines: pieces (distinct values)<br><b>Output</b><br><code>true</code> if the array can be formed by concatenating the pieces in any order without reordering inside a piece.","Sum of Absolute Differences in a Sorted Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: non-decreasing array<br><b>Output</b><br>For each <code>i</code>, the sum of <code>|a[i]-a[j]|</code> over all j.","Decode XORed Array":"<b>Input</b><br>Line 1: <code>m first</code> (m = length of encoded)<br>Line 2: encoded array (<code>encoded[i] = arr[i] XOR arr[i+1]</code>)<br><b>Output</b><br>The original array, given its first element.","Maximum Absolute Sum of Any Subarray":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The maximum of <code>|sum|</code> over all subarrays (the empty subarray counts as 0).","Maximum Ascending Subarray Sum":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: positive integers<br><b>Output</b><br>The maximum sum of a strictly ascending contiguous subarray.","Count Nice Pairs in an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: non-negative array<br><b>Output</b><br>Count pairs <code>i&lt;j</code> with <code>a[i] + rev(a[j]) == a[j] + rev(a[i])</code>, where rev reverses the digits.","Sign of the Product of an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>1</code> if the product is positive, <code>-1</code> if negative, <code>0</code> if zero.","Minimum Operations to Make the Array Increasing":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>One operation adds 1 to an element. Print the minimum operations so the array is strictly increasing.","Minimize Maximum Pair Sum in Array":"<b>Input</b><br>Line 1: <code>n</code> (even)<br>Line 2: array<br><b>Output</b><br>Pair up all elements to minimize the largest pair sum. Print that minimum.","Build Array from Permutation":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: a permutation of <code>0..n-1</code><br><b>Output</b><br><code>ans[i] = nums[nums[i]]</code>.","Find Greatest Common Divisor of Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The GCD of the smallest and the largest number.","Find the Kth Largest Integer in the Array":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: numbers as strings (no leading zeros, may be very large)<br><b>Output</b><br>The k-th largest by numeric value (duplicates count separately).","Find the Middle Index in Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The leftmost index where the sum on its left equals the sum on its right (empty side = 0), or <code>-1</code>.","Convert 1D Array Into 2D Array":"<b>Input</b><br>Line 1: <code>len m n</code><br>Line 2: the 1D array<br><b>Output</b><br>Build an <code>m &times; n</code> grid filling row by row. Print the rows, or <code>Empty</code> if the sizes don't match.","Find Target Indices After Sorting Array":"<b>Input</b><br>Line 1: <code>n target</code><br>Line 2: array<br><b>Output</b><br>Sort the array, then print the indices where <code>target</code> appears (ascending), or <code>Empty</code>.","K Radius Subarray Averages":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>For each index, the integer-floor average of the <code>2k+1</code> elements centred there, or <code>-1</code> if fewer than <code>k</code> elements exist on either side.","Rearrange Array Elements by Sign":"<b>Input</b><br>Line 1: <code>n</code> (even)<br>Line 2: array with equal numbers of positive and negative integers<br><b>Output</b><br>Rearrange so signs alternate, starting with a positive, keeping the relative order of positives and of negatives.","Find All Lonely Numbers in the Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>A number is lonely if it appears once and neither <code>x-1</code> nor <code>x+1</code> is present. Print all lonely numbers ascending, or <code>Empty</code>.","Partition Array According to Given Pivot":"<b>Input</b><br>Line 1: <code>n pivot</code><br>Line 2: array<br><b>Output</b><br>Rearrange so all elements &lt; pivot come first, then those equal, then those greater; keep relative order inside each group.","Count Equal and Divisible Pairs in an Array":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Count pairs <code>i&lt;j</code> with <code>a[i]==a[j]</code> and <code>(i*j) % k == 0</code>.","Count Array Pairs Divisible by K":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Count pairs <code>i&lt;j</code> with <code>a[i]*a[j]</code> divisible by k.","Most Frequent Number Following Key In an Array":"<b>Input</b><br>Line 1: <code>n key</code><br>Line 2: array (the answer is unique)<br><b>Output</b><br>Among the values immediately after an occurrence of <code>key</code>, print the most frequent.","Find All K-Distant Indices in an Array":"<b>Input</b><br>Line 1: <code>n key k</code><br>Line 2: array<br><b>Output</b><br>Indices <code>i</code> with some <code>j</code> where <code>a[j]==key</code> and <code>|i-j| &le; k</code>, ascending; <code>Empty</code> if none.","Divide Array Into Equal Pairs":"<b>Input</b><br>Line 1: <code>n</code> (even)<br>Line 2: array<br><b>Output</b><br><code>true</code> if the array can be divided into <code>n/2</code> pairs of equal elements.","Count Hills and Valleys in an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Treat runs of equal adjacent values as one. Count indices that are strictly higher (hill) or lower (valley) than their nearest different neighbours on both sides.","Find the Difference of Two Arrays":"<b>Input</b><br>Line 1: array A<br>Line 2: array B<br><b>Output</b><br>Line 1: distinct values in A but not in B (ascending). Line 2: distinct values in B but not in A (ascending). Use <code>Empty</code> for an empty list.","Maximum Sum Score of Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>For index <code>i</code> the sum score is the larger of the sum of the first <code>i+1</code> elements and the sum of the last <code>n-i</code> elements. Print the maximum over all i.","Find Triangular Sum of an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: digits 0-9<br><b>Output</b><br>Repeatedly replace the array with <code>(a[i]+a[i+1]) % 10</code> until one element is left. Print it.","Check if an Array Is Consecutive":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if it contains every integer from <code>min</code> to <code>min+n-1</code> exactly once.","Number of Ways to Split Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count split positions <code>i</code> (0 &le; i &lt; n-1) where the sum of the first <code>i+1</code> elements is &ge; the sum of the rest.","Number of Zero-Filled Subarrays":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count contiguous subarrays consisting only of zeros.","Make Array Zero by Subtracting Equal Amounts":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: non-negative array<br><b>Output</b><br>Each operation subtracts one positive value <code>x</code> (no larger than the smallest non-zero element) from all positive elements. Print the minimum operations to make every element 0.","Count Strictly Increasing Subarrays":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count contiguous subarrays (length &ge; 1) that are strictly increasing.","Find Subarrays With Equal Sum":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br><code>true</code> if two different subarrays of length 2 have equal sums.","Find The Original Array of Prefix Xor":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array <code>pref</code><br><b>Output</b><br><code>pref[i] = arr[0] ^ ... ^ arr[i]</code>. Print <code>arr</code>.","Apply Operations to an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>For i from 0 to n-2: if <code>a[i]==a[i+1]</code> then double <code>a[i]</code> and set <code>a[i+1]=0</code>. Afterwards move all zeros to the end (keep the order of non-zero values).","Longest Subarray With Maximum Bitwise AND":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: positive integers<br><b>Output</b><br>Among subarrays with the maximum possible bitwise AND, print the length of the longest.","Number of Unequal Triplets in Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count triplets <code>i&lt;j&lt;k</code> whose three values are pairwise different.","Number of Subarrays With GCD Equal to K":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Count subarrays whose greatest common divisor is exactly k.","Number of Subarrays With LCM Equal to K":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Count subarrays whose least common multiple is exactly k.","Longest Nice Subarray":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: positive integers<br><b>Output</b><br>A subarray is nice if the bitwise AND of every pair of elements at different positions is 0. Print the length of the longest nice subarray.","Maximum Length of Repeated Subarray":"<b>Input</b><br>Line 1: array A<br>Line 2: array B<br><b>Output</b><br>Length of the longest subarray that appears in both.","Maximum Size Subarray Sum Equals k":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>The longest subarray with sum exactly k (<code>0</code> if none).","Find Minimum in Rotated Sorted Array II":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: a sorted array (may contain duplicates) rotated by some amount<br><b>Output</b><br>The minimum element.","Median of Two Sorted Arrays":"<b>Input</b><br>Line 1: sorted array A<br>Line 2: sorted array B<br><b>Output</b><br>The median of the combined sorted values (for an even count, the mean of the two middle values).","Maximum Distance in Arrays":"<b>Input</b><br>Line 1: <code>m</code> (arrays)<br>Next <code>m</code> lines: sorted arrays<br><b>Output</b><br>The maximum <code>|a-b|</code> where a and b come from two different arrays.","Number of Subarrays with Bounded Maximum":"<b>Input</b><br>Line 1: <code>n left right</code><br>Line 2: array<br><b>Output</b><br>Count subarrays whose maximum lies in <code>[left, right]</code>.","Shortest Subarray with Sum at Least K":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array (may be negative)<br><b>Output</b><br>The length of the shortest non-empty subarray with sum &ge; k, or <code>-1</code>.","Bitwise ORs of Subarrays":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The number of distinct values of the bitwise OR over all subarrays.","Sort an Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The array sorted ascending.","Subarrays with K Different Integers":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Count subarrays with exactly k distinct integers.","Maximum Sum of Two Non-Overlapping Subarrays":"<b>Input</b><br>Line 1: <code>n firstLen secondLen</code><br>Line 2: non-negative array<br><b>Output</b><br>The maximum total of one subarray of length firstLen and one of length secondLen that do not overlap (either may come first).","Partition Array for Maximum Sum":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>Partition into contiguous subarrays of length at most k; each subarray's values become its maximum. Print the largest possible sum of the array.","Count Triplets That Can Form Two Arrays of Equal XOR":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count triplets <code>(i,j,k)</code> with <code>0&le;i&lt;j&le;k&lt;n</code> such that <code>a[i]^...^a[j-1] == a[j]^...^a[k]</code>.","Maximum Number of Non-Overlapping Subarrays With Sum Equals Target":"<b>Input</b><br>Line 1: <code>n target</code><br>Line 2: array<br><b>Output</b><br>The maximum number of non-empty, non-overlapping subarrays each with sum equal to target.","Maximum Length of Subarray With Positive Product":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>The length of the longest subarray whose product is positive.","Shortest Subarray to be Removed to Make Array Sorted":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Remove one contiguous subarray (possibly empty) so the rest is non-decreasing. Print the minimum length to remove.","Minimum Number of Removals to Make Mountain Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>A mountain array has length &ge; 3 and strictly increases to a peak then strictly decreases. Print the minimum elements to remove to get a mountain.","Ways to Make a Fair Array":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: array<br><b>Output</b><br>Count indices whose removal makes <code>sum of even-indexed elements == sum of odd-indexed elements</code> (indices re-number after removal).","Maximum Score of a Good Subarray":"<b>Input</b><br>Line 1: <code>n k</code><br>Line 2: array<br><b>Output</b><br>A subarray <code>[i..j]</code> is good if <code>i &le; k &le; j</code>; its score is <code>min(a[i..j]) * (j-i+1)</code>. Print the maximum score.","Ways to Split Array Into Three Subarrays":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: non-negative array<br><b>Output</b><br>Count ways to split into three non-empty contiguous parts with <code>sum(left) &le; sum(mid) &le; sum(right)</code>.","Longest Continuous Subarray With Absolute Diff Less Than or Equal to Limit":"<b>Input</b><br>Line 1: <code>n limit</code><br>Line 2: array<br><b>Output</b><br>The length of the longest subarray where the difference between any two elements is at most <code>limit</code>.","Longest Palindromic Substring":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>The <b>length</b> of the longest palindromic substring.","String to Integer (atoi)":"<b>Input</b><br>One line (may have leading spaces).<br><b>Output</b><br>Skip leading spaces, read an optional sign and digits until a non-digit, clamp to the 32-bit signed range. Print the integer (0 if no digits).","Multiply Strings":"<b>Input</b><br>Two lines: non-negative integers as strings (arbitrarily long).<br><b>Output</b><br>Their product as a string.","Palindrome Permutation":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br><code>true</code> if some permutation of the string is a palindrome.","Longest Palindromic Subsequence":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>The length of the longest palindromic subsequence.","Permutation in String":"<b>Input</b><br>Line 1: <code>s1</code><br>Line 2: <code>s2</code><br><b>Output</b><br><code>true</code> if some permutation of s1 is a substring of s2.","Delete Operation for Two Strings":"<b>Input</b><br>Two lines: <code>word1</code>, <code>word2</code>.<br><b>Output</b><br>The minimum number of single-character deletions to make the two strings equal.","Minimum ASCII Delete Sum for Two Strings":"<b>Input</b><br>Two lines: <code>s1</code>, <code>s2</code>.<br><b>Output</b><br>The minimum total ASCII value of deleted characters to make the strings equal.","1-bit and 2-bit Characters":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: bits (the last is 0)<br><b>Output</b><br>Characters are <code>0</code> (one bit) or <code>10</code>/<code>11</code> (two bits). <code>true</code> if the last character must be a one-bit character.","Find Smallest Letter Greater Than Target":"<b>Input</b><br>Line 1: sorted letters (space separated)<br>Line 2: target letter<br><b>Output</b><br>The smallest letter strictly greater than target (wrap around to the first letter).","Valid Word Abbreviation":"<b>Input</b><br>Line 1: word<br>Line 2: abbreviation (digits replace substrings; no leading zeros)<br><b>Output</b><br><code>true</code> if the abbreviation matches the word.","Valid Word Square":"<b>Input</b><br>Line 1: <code>n</code><br>Next <code>n</code> lines: words<br><b>Output</b><br><code>true</code> if the k-th row reads the same as the k-th column.","Maximum Product of Word Lengths":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: words<br><b>Output</b><br>The maximum <code>len(a)*len(b)</code> over two words that share no letters (<code>0</code> if none).","Interleaving String":"<b>Input</b><br>Three lines: <code>s1</code>, <code>s2</code>, <code>s3</code>.<br><b>Output</b><br><code>true</code> if s3 is an interleaving of s1 and s2 (keeping each string's order).","Shortest Palindrome":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>Add characters only in front to make a palindrome. Print the shortest palindrome you can obtain.","Remove Duplicate Letters":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>Remove duplicate letters so every letter appears once, giving the lexicographically smallest result.","Smallest Subsequence of Distinct Characters":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>The lexicographically smallest subsequence containing every distinct letter exactly once.","Integer to English Words":"<b>Input</b><br>A non-negative integer (below 2<sup>31</sup>).<br><b>Output</b><br>Its English words (e.g. <code>One Hundred Twenty Three</code>).","Letter Case Permutation":"<b>Input</b><br>A string of letters and digits.<br><b>Output</b><br>All strings by changing the case of letters, one per line in ascending (ASCII) order.","Unique Morse Code Words":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: lowercase words<br><b>Output</b><br>The number of different Morse-code transformations (standard International Morse alphabet).","Number of Lines To Write String":"<b>Input</b><br>Line 1: 26 widths of a..z<br>Line 2: string<br><b>Output</b><br>A line holds at most 100 pixels; a letter cannot be split across lines. Print <code>lines width_of_last_line</code>.","Shortest Distance to a Character":"<b>Input</b><br>Line 1: string<br>Line 2: character <code>c</code> (present in the string)<br><b>Output</b><br>For each index, the distance to the closest occurrence of c.","Uncommon Words from Two Sentences":"<b>Input</b><br>Two lines of space-separated lowercase words.<br><b>Output</b><br>A word is uncommon if it appears exactly once in one sentence and not at all in the other. Print them sorted, space separated (<code>Empty</code> if none).","Find Common Characters":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: words<br><b>Output</b><br>Characters (with multiplicity) that appear in every word, sorted, space separated (<code>Empty</code> if none).","Remove All Adjacent Duplicates In String":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>Repeatedly delete two equal adjacent letters until none remain. Print the result (<code>Empty</code> if nothing is left).","Greatest Common Divisor of Strings":"<b>Input</b><br>Two lines <code>str1</code>, <code>str2</code>.<br><b>Output</b><br>The largest string <code>x</code> such that both strings are x repeated some number of times (print <code>Empty</code> if none).","Letter Tile Possibilities":"<b>Input</b><br>A string of tiles (uppercase letters).<br><b>Output</b><br>The number of distinct non-empty sequences you can make from the tiles.","Find K-Length Substrings With No Repeated Characters":"<b>Input</b><br>Line 1: string<br>Line 2: <code>k</code><br><b>Output</b><br>Count substrings of length k with all distinct characters.","Remove Vowels from a String":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>The string with the vowels <code>aeiou</code> removed (<code>Empty</code> if nothing remains).","Find Words That Can Be Formed by Characters":"<b>Input</b><br>Line 1: words<br>Line 2: chars<br><b>Output</b><br>A word is good if it can be formed from <code>chars</code> (each used once). Print the total length of good words.","Last Substring in Lexicographical Order":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>The lexicographically largest substring.","Compare Strings by Frequency of the Smallest Character":"<b>Input</b><br>Line 1: queries<br>Line 2: words<br><b>Output</b><br><code>f(s)</code> = frequency of the smallest letter of s. For each query, count words w with <code>f(query) &lt; f(w)</code>. Print the counts space separated.","Count Substrings with Only One Distinct Letter":"<b>Input</b><br>A lowercase string.<br><b>Output</b><br>Count substrings (by position) that contain only one distinct letter.","Remove All Adjacent Duplicates in String II":"<b>Input</b><br>Line 1: string<br>Line 2: <code>k</code><br><b>Output</b><br>Repeatedly remove <code>k</code> equal adjacent letters. Print the final string (<code>Empty</code> if nothing is left).","Valid Palindrome III":"<b>Input</b><br>Line 1: string<br>Line 2: <code>k</code><br><b>Output</b><br><code>true</code> if the string becomes a palindrome after removing at most k characters.","Split a String in Balanced Strings":"<b>Input</b><br>A string of <code>L</code> and <code>R</code>.<br><b>Output</b><br>Split into the maximum number of balanced strings (equal L and R). Print that number.","Maximum Length of a Concatenated String with Unique Characters":"<b>Input</b><br>Line 1: <code>n</code><br>Line 2: words<br><b>Output</b><br>Concatenate a subsequence of the words so all characters are unique. Print the maximum possible length.","Decrypt String from Alphabet to Integer Mapping":"<b>Input</b><br>A string of digits and <code>#</code>.<br><b>Output</b><br><code>1-9</code> map to ],["1","1"],["10","89"],["45","1836311903"],["20","10946"]]},"Fibonacci Number":{"s":"Print <code>F(n)<\/code> where <code>F(0)=0<\/code>, <code>F(1)=1<\/code> and <code>F(n)=F(n-1)+F(n-2)<\/code>.","i":"An integer <code>n<\/code> (0 &le; n &le; 30).","o":"F(n).","tests":[["2","1"],["3","2"],["4","3"],["0","0"],["1","1"],["30","832040"]]},"N-th Tribonacci Number":{"s":"Tribonacci numbers: <code>T0=0, T1=1, T2=1<\/code> and <code>T(n+3)=T(n)+T(n+1)+T(n+2)<\/code>. Print <code>T(n)<\/code>.","i":"An integer <code>n<\/code> (0 &le; n &le; 37).","o":"T(n).","tests":[["4","4"],["25","1389537"],["0","0"],["1","1"],["2","1"],["37","2082876103"]]},"Power of Two":{"s":"Print <code>true<\/code> if the integer <code>n<\/code> is a power of two, otherwise <code>false<\/code>.","i":"An integer <code>n<\/code>.","o":"<code>true<\/code> or <code>false<\/code>.","tests":[["1","true"],["16","true"],["3","false"],["0","false"],["-16","false"],["1073741824","true"]]},"Power of Three":{"s":"Print <code>true<\/code> if the integer <code>n<\/code> is a power of three, otherwise <code>false<\/code>.","i":"An integer <code>n<\/code>.","o":"<code>true<\/code> or <code>false<\/code>.","tests":[["27","true"],["0","false"],["-1","false"],["9","true"],["45","false"],["1162261467","true"]]},"Power of Four":{"s":"Print <code>true<\/code> if the integer <code>n<\/code> is a power of four, otherwise <code>false<\/code>.","i":"An integer <code>n<\/code>.","o":"<code>true<\/code> or <code>false<\/code>.","tests":[["16","true"],["5","false"],["1","true"],["0","false"],["8","false"],["64","true"]]},"Number of 1 Bits":{"s":"Print the number of <code>1<\/code> bits in the binary representation of the non-negative integer <code>n<\/code> (its Hamming weight).","i":"An integer <code>n<\/code> (0 &le; n &lt; 2<sup>31<\/sup>).","o":"Count of set bits.","tests":[["11","3"],["128","1"],["2147483645","30"],["0","0"],["7","3"],["1023","10"]]},"Counting Bits":{"s":"For every <code>i<\/code> from 0 to <code>n<\/co irst <code>numRows<\/code> rows of Pascal's triangle, one row per line, numbers separated by spaces.","i":"An integer <code>numRows<\/code> (1 &le; n &le; 30).","o":"numRows lines.","tests":[["5","1\n1 1\n1 2 1\n1 3 3 1\n1 4 6 4 1"],["1","1"],["2","1\n1 1"],["6","1\n1 1\n1 2 1\n1 3 3 1\n1 4 6 4 1\n1 5 10 10 5 1"],["10","1\n1 1\n1 2 1\n1 3 3 1\n1 4 6 4 1\n1 5 10 10 5 1\n1 6 15 20 15 6 1\n1 7 21 35 35 21 7 1\n1 8 28 56 70 56 28 8 1\n1 9 36 84 126 126 84 36 9 1"]]},"Single Number":{"s":"Every element appears twice except one. Print the element that appears once.","i":"Line 1: <code>n<\/code> (odd). Line 2: the array.","o":"The single element.","tests":[["3\n2 2 1","1"],["5\n4 1 2 1 2","4"],["1\n1","1"],["5\n7 3 7 -4 3","-4"],["3\n9 8 9","8"]]},"Single Number II":{"s":"Every element appears three times except one, which appears once. Print that element.","i":"Line 1: <code>n<\/code>. Line 2: the array.","o":"The single element.","tests":[["4\n2 2 3 2","3"],["7\n0 1 0 1 0 1 99","99"],["1\n5","5"],["4\n-1 -1 -1 8","8"],["7\n6 6 6 3 3 3 -7","-7"]]},"Contains Duplicate":{"s":"Print <code>true<\/code> if any value appears at least twice in the array, otherwise <code>false<\/code>.","i":"Line 1: <code>n<\/code>. Line 2: the array.","o":"<code>true<\/code> or <code>false<\/code>.","tests":[["4\n1 2 3 1","true"],["4\n1 2 3 4","false"],["10\n1 1 1 3 3 4 3 2 4 2","true"],["1\n7","false"],["3\n-1 0 -1","true"]]},"Move Zeroes":{"s":"Move all zeros to the end of the array while keeping the order of the non-zero elements. Print the resulting array.","i":"Line 1: <code>n<\/code>. Line 2: the array.","o":"The rearranged array.","tests":[["5\n0 1 0 3 12","1 3 12 0 0"],["1\n0","0"],["3\n1 2 3","1 2 3"],["3\n0 0 1","1 0 0"],["6\n4 0 0 5 0 6","4 5 6 0 0 0"]]},"Fizz Buzz":{"s":"For each <code>i<\/code> from 1 to <code>n<\/code> print <code>FizzBuzz<\/code> if i is divisible by 3 and 5, <code>Fizz<\/code> if divisible by 3, <code>Buzz<\/code> if divisible by 5, otherwise <code>i<\/code>. One
