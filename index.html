let PT="ac";const ptab=t=>{PT=t;profile(1)};

const sk=[[2,"Advanced"],[1,"Intermediate"],[0,"Fundamental"]].map(([d,n])=>{const c={};Q.forEach(x=>{if(x.d==d&&solved[x.id])c[x.c]=(c[x.c]||0)+1});return[n,Object.entries(c).sort((a,b)=>b[1]-a[1])]}).filter(x=>x[1].length);

const yr=subs.filter(x=>Date.now()-x.ts<365*864e5).length;
const B=[["First solve",S.s>=1],["5 solved",S.s>=5],["25 solved",S.s>=25],["100 solved",S.s>=100],["7-day streak",st.max>=7],["Hard hitter",S.n[2]>=5],["Polyglot",Object.keys(lg).length>=3]],bn=B.filter(x=>x[1]).length;

app.innerHTML=`<div class="prof"><div><div class="panel"><div style="display:flex;gap:14px;align-items:center"><div class="big" style="background:${p.color}">${esc((p.name.trim()[0]||"?").toUpperCase())}</div><div><b style="font-size:18px">${esc(p.name)}</b><div class="mu">@${esc(p.user)}</div><div class="mu" title="Local estimate based on problems solved">Rank <b style="color:var(--tx)">${rank.toLocaleString("en-US")}</b></div></div></div>
${p.bio?`<p>${esc(p.bio)}</p>`:""}<div style="display:flex;gap:20px;margin:10px 0"><span><b>0</b> <span class="mu">Following</span></span><span><b>0</b> <span class="mu">Followers</span></span></div>
<button class="sub" style="width:100%;margin-bottom:8px" onclick="editProf()">Edit Profile</button>${p.loc?`<div class="pl">📍 ${esc(p.loc)}</div>`:""}${p.edu?`<div class="pl">🎓 ${esc(p.edu)}</div>`:""}${links}</div>
<div class="panel"><b>Community Stats</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">${zero("Views")}${zero("Solution")}${zero("Discuss")}${zero("Reputation")}</div></div>
<div class="panel"><b>Languages</b><div style="margin-top:10px">${Object.entries(lg).sort((a,b)=>b[1]-a[1]).map(([l,n])=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="tg">${esc(l)}</span><span class="mu"><b style="color:var(--tx)">${n}</b> problems solved</span></div>`).join("")||'<div class="mu">Solve a problem to see languages.</div>'}</div></div>
<div class="panel"><b>Skills</b>${sk.map(([n,e])=>`<div style="margin-top:12px"><div class="mu" style="margin-bottom:6px">${n}</div>${e.slice(0,3).map(tg).join("")}${e.length>3?`<details><summary>Show more</summary>${e.slice(3).map(tg).join("")}</details>`:""}</div>`).join("")||'<div class="mu" style="margin-top:8px">Your skills appear here as you solve problems.</div>'}</div></div>
<div><div style="display:grid;grid-template-columns:3fr 2fr;gap:16px" class="two"><div class="panel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="text-align:center"><div class="ring" style="--p:${S.s/Q.length*100};margin:0 auto"><div><b style="font-size:22px">${S.s}<span class="mu" style="font-size:12px">/${Q.length}</span></b><span style="color:var(--e)">✔ Solved</span></div></div><div class="mu" style="margin-top:6px">${att} Attempting</div></div>
<div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px">${DN.map((n,i)=>`<div style="display:flex"><div class="sb"><span class="d${i}">${n.replace("Medium","Med.")}</span> <b>${S.n[i]}</b><span class="mu">/${S.t[i]}</span></div></div>`).join("")}<div class="mu">Acceptance <b style="color:var(--tx)">${acc}%</b> · ${subs.length} submission${subs.length==1?"":"s"}</div></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between"><b>Badges</b><b>${bn}</b></div><div style="margin-top:10px">${B.map(b=>`<span class="bd ${b[1]?"":"off"}" title="${b[1]?"Earned":"Locked"}">🏅 ${b[0]}</span>`).join("")}</div></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px"><span><b>${yr}</b> submissions in the past one year</span><span class="mu">Total active days: <b style="color:var(--tx)">${st.act}</b> · Max streak: <b style="color:var(--tx)">${st.max}</b></span></div><div style="overflow:auto"><div class="ml">${ml}</div><div class="hm">${cells}</div></div></div>
<div class="panel"><div class="tabs" style="border:0;padding:0 0 8px">${[["ac","Recent AC"],["all","List"],["sol","Solutions"],["dis","Discuss"]].map(t=>`<span class="tab ${PT==t[0]?"on":""}" onclick="ptab('${t[0]}')">${t[1]}</span>`).join("")}<span class="sp"></span><a class="mu" style="cursor:pointer" onclick="ptab('all')">View all submissions</a></div>
${PT=="sol"||PT=="dis"?`<div class="mu" style="padding:14px 0">Nothing here yet.</div>`:list.map(x=>`<div class="sr" onclick="open_(${x.id})"><span style="flex:1">${esc(x.t)}</span>${PT=="all"?`<span class="${x.ok?"ok":"d2"}">${x.ok?"Accepted":"Failed"}</span><span class="pill">${esc(x.l)}</span>`:""}<span class="mu">${ago(x.ts)}</span></div>`).join("")||'<div class="mu" style="padding:14px 0">No submissions yet. Open a problem and press Submit.</div>'}</div>
<div class="mu" style="text-align:center;font-size:12px">Copyright © 2026 ProblemX · India</div></div></div>`;if(!keep)scrollTo(0,0)}
